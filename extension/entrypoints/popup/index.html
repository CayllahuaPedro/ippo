<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ippo for Chrome</title>
  </head>
  <body>
    <main class="panel">
      <h1 class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 10 V50"/><path d="M24 28 H36"/><path d="M10 32 V50"/><path d="M5 50 H34"/><path class="brand-step" d="M34 50 H45 V37 H59"/></svg>Ippo</h1>
      <button id="parse" class="btn-primary">Anotar página</button>
      <button id="revert" class="btn-text">Quitar anotaciones</button>
      <p id="status" class="status" data-state="idle">
        <span class="status-dot"></span>
        <span id="status-text"></span>
      </p>
      <section class="settings">
        <label class="setting-row" for="yt-dual">
          <span>Subtítulos duales en YouTube</span>
          <input id="yt-dual" class="switch" type="checkbox" />
        </label>
        <label class="setting-row" for="yt-pause">
          <span>Pausar al buscar una palabra</span>
          <input id="yt-pause" class="switch" type="checkbox" />
        </label>
        <label class="setting-field" for="native-lang">
          <span>Idioma de traducción</span>
          <select id="native-lang"></select>
        </label>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
